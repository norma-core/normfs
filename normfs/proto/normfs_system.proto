syntax = "proto3";

package normfs.system;

import "normfs.proto";

enum EventType {
    ET_FILE_STORED      = 0;
    ET_FILE_LANDED      = 1;
    ET_UPLOAD_FAILED    = 2;
    ET_FILE_EVICTED     = 3;
    ET_EVICTION_BLOCKED = 4;
    ET_POOL_STALLED     = 5;
    ET_QUEUE_STARTED    = 6;
    ET_QUEUE_CLOSED     = 7;
}

// Values as in the store header.
enum Compression {
    C_NONE = 0;
    C_GZIP = 1;
    C_XZ   = 2;
    C_ZSTD = 3;
}

enum Encryption {
    E_NONE = 0;
    E_AES  = 1;
}

enum FileKind {
    FK_WAL   = 0;
    FK_STORE = 1;
}

enum UploadFailure {
    UF_NETWORK       = 0;
    UF_HTTP_STATUS   = 1;
    UF_MISSING       = 2;
    UF_SIZE_MISMATCH = 3;
    UF_LOCAL_READ    = 4;
}

enum EvictionBlock {
    EB_NOT_OFFLOADED = 0;
    EB_DELETE_FAILED = 1;
    EB_NOTHING_FOUND = 2;
}

// A store file as its own header and signature block describe it.
message File {
    normfs.Id   file_id     = 1;
    // Holds ids first_id .. first_id + num_entries - 1.
    normfs.Id   first_id    = 2;
    uint64      num_entries = 3;
    uint64      file_bytes  = 4;
    // WAL bytes before compression; 0 when not known.
    uint64      raw_bytes   = 5;
    Compression compression = 6;
    Encryption  encryption  = 7;
    // The same 64 bytes as in the file, so an object can be matched against
    // this record without downloading it.
    bytes       content_signature = 8;
}

// One record of `<instance>/normfs/system`. Only NormFS writes there; a
// client write to that path is refused.
message Event {
    normfs.Stamp stamp = 1;
    EventType    type  = 2;
    // Emission never waits, so events dropped since the previous record are
    // counted instead.
    uint64       dropped_before = 3;
    string       queue = 4;

    // ET_FILE_STORED, ET_FILE_LANDED
    File file = 10;

    // ET_FILE_LANDED. Nothing is left to upload up to landed_through, so local
    // copies up to it may be deleted.
    string    key            = 20;
    uint64    duration_ms    = 21;
    normfs.Id landed_through = 22;

    // ET_UPLOAD_FAILED. Retried every second; attempts 1, 2, 4, 8 and so on
    // are reported.
    normfs.Id     failed_file_id = 30;
    UploadFailure upload_failure = 31;
    uint32        http_status    = 32;
    uint64        local_bytes    = 33;
    uint64        remote_bytes   = 34;
    string        error          = 35;

    // ET_FILE_EVICTED
    FileKind  evicted_kind    = 40;
    normfs.Id evicted_file_id = 41;
    uint64    evicted_bytes   = 42;
    bool      in_cloud        = 43;

    // ET_FILE_EVICTED, ET_EVICTION_BLOCKED
    uint64 queue_bytes = 50;

    // ET_EVICTION_BLOCKED. Reported once per reason until the queue is back
    // under the limit or the reason changes.
    EvictionBlock eviction_block = 60;
    normfs.Id     held_at        = 61;
    uint64        limit_bytes    = 62;

    // ET_POOL_STALLED: when the stall starts, every 30 seconds while it lasts,
    // and once with resumed when it ends.
    uint64 waits          = 70;
    uint64 stalled_for_ms = 71;
    bool   resumed        = 72;

    // ET_QUEUE_STARTED, ET_QUEUE_CLOSED
    normfs.Id last_id  = 80;
    bool      readonly = 81;
    bool      wal      = 82;
    bool      store    = 83;
    bool      cloud    = 84;
}
