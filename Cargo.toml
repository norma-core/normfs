[workspace]
resolver = "2"
members = [
    "normfs",
    "normfs-types",
    "normfs-time",
    "normfs-wal",
    "normfs-store",
    "normfs-cloud",
    "normfs-crypto",
    "normfs-fs",
    "uintn-rs",
]
exclude = ["normfs_go", "go.work", "go.work.sum"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.99"
authors = ["Norma Core Team"]
license = "MIT"
repository = "https://github.com/norma-core/normfs"
homepage = "https://normacore.dev"

[workspace.dependencies]
# Shared dependencies across workspace
tokio = { version = "1.49", features = ["full"] }
bytes = "1.11"
prost = "0.12"
log = "0.4.28"

# Internal workspace crates
uintn = { version = "0.4.2", path = "uintn-rs" }
normfs-types = { version = "0.4.2", path = "normfs-types" }
normfs-time = { version = "0.4.2", path = "normfs-time" }
normfs-wal = { version = "0.4.2", path = "normfs-wal" }
normfs-store = { version = "0.4.2", path = "normfs-store" }
normfs-cloud = { version = "0.4.2", path = "normfs-cloud" }
normfs-crypto = { version = "0.4.2", path = "normfs-crypto" }
normfs-fs = { version = "0.4.2", path = "normfs-fs" }

# Dev dependencies
tempfile = "3.25"
criterion = "0.5"
env_logger = "0.11"
