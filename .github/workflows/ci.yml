name: ci

# Scope follows the tree: verify/Makefile discovers every C module and the
# verify-* targets it declares, so a branch adding a module is covered without
# editing this file or that one.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # --locked: Cargo.lock is tracked, so a resolution that drifts from it
      # (a yanked dep replaced behind our back, a manifest bump nobody
      # relocked) fails here rather than at `cargo publish`.
      - run: cargo test --workspace --locked

  windows:
    name: cargo test --workspace (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # cl is what a Windows user gets by default; mingw gcc builds the
        # same C under the flags the Unix jobs use.
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # From GitHub releases: the Chocolatey feed has timed out on these runners.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }}

  build:
    name: build + test C (c99, -Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The runner's gcc, not the pinned image: this checks portability.
      # test implies build. It exercises the SSE4.2 CRC32C path against a
      # polynomial reference, and checks that check-proved.sh still rejects a
      # report with an open goal — neither is something the proof job can do.
      - name: Build and test every C module
        run: make -f verify/Makefile test

  cross:
    name: cross build (zig)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - run: cargo install cargo-zigbuild@0.23.0 --locked
      # Every other job is a native gcc build, where the compiler's baseline
      # hides what breaks here. The runner is x86_64, so the cross-built tests
      # also run: WP assumes the intrinsic path rather than proving it.
      - name: x86_64
        run: |
          # Cargo names the test binaries it built; their directory moved in 1.100.
          cargo zigbuild -p normfs-wal --release --target x86_64-unknown-linux-gnu --tests \
              --message-format=json-render-diagnostics > build.json
          ran=0
          for t in $(jq -r 'select(.executable != null) | .executable' build.json); do
              "$t"
              ran=$((ran + 1))
          done
          # No binary named means the build changed, not that the tests passed.
          test "$ran" -gt 0
      - name: aarch64
        run: cargo zigbuild -p normfs-wal --release --target aarch64-unknown-linux-gnu
