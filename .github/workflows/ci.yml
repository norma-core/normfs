name: ci

# Scope follows the tree: verify/Makefile discovers every C module and the
# verify-* targets it declares, so a branch adding a module is covered without
# editing this file or that one.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # --locked: Cargo.lock is tracked, so a resolution that drifts from it
      # (a yanked dep replaced behind our back, a manifest bump nobody
      # relocked) fails here rather than at `cargo publish`.
      - run: cargo test --workspace --locked

  build:
    name: build + test C (c99, -Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The runner's gcc, not the pinned image: this checks portability.
      # test implies build. It exercises the SSE4.2 CRC32C path against a
      # polynomial reference, and checks that check-proved.sh still rejects a
      # report with an open goal — neither is something the proof job can do.
      - name: Build and test every C module
        run: make -f verify/Makefile test

  cross:
    name: cross build (zig)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - run: cargo install cargo-zigbuild@0.23.0 --locked
      # Every other job is a native gcc build, where the compiler's baseline
      # hides what breaks here. The runner is x86_64, so the cross-built tests
      # also run: WP assumes the intrinsic path rather than proving it.
      - name: x86_64
        run: |
          cargo zigbuild -p normfs-wal --release --target x86_64-unknown-linux-gnu --tests
          ran=0
          for t in target/x86_64-unknown-linux-gnu/release/deps/normfs_wal-*; do
              if [ -f "$t" ] && [ -x "$t" ]; then "$t"; ran=$((ran + 1)); fi
          done
          # A glob that matches no binary means the layout moved, not that the
          # tests passed.
          test "$ran" -gt 0
      - name: aarch64
        run: cargo zigbuild -p normfs-wal --release --target aarch64-unknown-linux-gnu

  image:
    name: toolchain image
    # Larger runner: this builds the pinned Frama-C image from source, which is
    # the ~10 minute half of a cold run.
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/verify-image
          key: verify-image-${{ hashFiles('verify/Dockerfile') }}
      # if/then, not `[ -f ] && exit 0`: under bash -e a short-circuited &&
      # fails the step on exactly the cold-cache path this handles.
      - name: Build if not cached
        run: |
          if [ ! -f /tmp/verify-image/image.tar ]; then
            docker build -t normfs-verify:pinned -f verify/Dockerfile verify
            mkdir -p /tmp/verify-image
            docker save normfs-verify:pinned -o /tmp/verify-image/image.tar
          fi

  proofs:
    name: WP
    # Larger runner: WP is the long pole, tens of minutes across the discovered
    # targets, and the only job whose wall clock anyone waits on.
    runs-on: ubuntu-latest-m
    needs: image
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore the pinned toolchain image
        uses: actions/cache@v4
        with:
          path: /tmp/verify-image
          key: verify-image-${{ hashFiles('verify/Dockerfile') }}

      - name: Load the pinned toolchain image
        run: docker load -i /tmp/verify-image/image.tar

      # Restore and save are separate steps: on a job the timeout cancels,
      # cache@v4's post step is skipped, and a run that proved six of seven
      # targets would leave nothing behind. An explicit save still runs.
      # The key is unique per attempt because an entry is immutable once
      # written, and the prefix restores the newest one the branch can see.
      # The image hash is in it so a toolchain bump starts a fresh directory
      # rather than carrying dead entries forever.
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          path: .wp-cache
          key: wp-cache-${{ hashFiles('verify/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wp-cache-${{ hashFiles('verify/Dockerfile') }}-

      # pipefail: the container's exit status is the whole signal, and tee's
      # would always be 0.
      - name: Prove
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            -e FRAMAC_WP_CACHE=update -e FRAMAC_WP_CACHEDIR=/work/.wp-cache \
            normfs-verify:pinned \
            make -f verify/Makefile verify 2>&1 | tee wp.log

      - name: Save the proof cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .wp-cache
          key: wp-cache-${{ hashFiles('verify/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarise
        if: always()
        run: ./verify/summarize.sh build-verify/logs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-log
          path: wp.log
