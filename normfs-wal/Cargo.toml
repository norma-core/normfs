[package]
name = "normfs-wal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Write-ahead log implementation for NormFS with crash recovery"

[dependencies]
log = "0.4"
bytes = "1"
uintn = { version = "0.2.0-beta.3", path = "../uintn-rs" }
normfs-types = { version = "0.2.0-beta.3", path = "../normfs-types" }
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
walkdir = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
# xxh32 is a benchmark comparison only; the runtime dependency above stays at
# xxh64, which is what the V0 read path uses.
xxhash-rust = { version = "0.8", features = ["xxh32"] }
tempfile = "3"
criterion = "0.5"
env_logger = { workspace = true }
rand = "0.8"

# WAL benchmarks. Every case is fixed in code; see benches/common/mod.rs.
[[bench]]
name = "wal_codec"
harness = false

[[bench]]
name = "wal_scan"
harness = false

[[bench]]
name = "wal_sizes"
harness = false

[[bench]]
name = "wal_memory"
harness = false

[[bench]]
name = "wal_range"
harness = false

[[bench]]
name = "wal_sweep"
harness = false
