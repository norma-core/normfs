[package]
name = "normfs-cloud"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S3-compatible cloud storage integration for NormFS"

[dependencies]
rusty-s3 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
url = "2.5"
urlencoding = "2.1"
uintn = { version = "0.4.2", path = "../uintn-rs" }
normfs-types = { version = "0.4.2", path = "../normfs-types" }
normfs-store = { version = "0.4.2", path = "../normfs-store" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

[dev-dependencies]
env_logger = { workspace = true }
normfs-wal = { version = "0.4.2", path = "../normfs-wal" }
tempfile = { workspace = true }
uuid = { version = "1", features = ["v4"] }
